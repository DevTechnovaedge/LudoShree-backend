; King (Daddy King) WebSocket sync daemon — one instance only.
; Installed by: sudo bash scripts/setup-king-supervisor.sh

[program:king-listen]
command=php /var/www/html/ludo-shree/artisan king:listen
directory=/var/www/html/ludo-shree
autostart=true
autorestart=true
startretries=999
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/king-listen.log
stopwaitsecs=10
